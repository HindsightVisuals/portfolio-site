<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>commms — interaction and story telling</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Typekit, loaded without blocking the first paint. A plain stylesheet
         link here is a cross-origin, render-blocking request (Lighthouse: 290ms
         on the deployed site). media="print" makes the browser fetch it at low
         priority without blocking, and the onload swap promotes it to all.
         Trade-off: text paints in Space Grotesk first and swaps to Loos when the
         kit lands. Every rule already declares that fallback, and the strip,
         logo and COMMMS mark all re-measure on document.fonts.ready. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://use.typekit.net/jhm5bdq.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://use.typekit.net/jhm5bdq.css" /></noscript>
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>

    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <filter id="dissolve" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="disp" />
        <feGaussianBlur in="disp" stdDeviation="0" />
      </filter>
    </svg>

    <header class="chrome">
      <span class="corner-mark tl" aria-hidden="true"></span>
      <span class="corner-mark tr" aria-hidden="true"></span>
      <span class="corner-mark bl" aria-hidden="true"></span>
      <span class="corner-mark br" aria-hidden="true"></span>

      <!-- Marginalia, sitting beside the corner registration marks. Read off
           the hi-fi mock's chrome. Part of .chrome, so it fades with the rest
           of the home UI as the camera leaves. -->
      <p class="margin-note margin-note--tl">communication is what sets us apart</p>
      <p class="margin-note margin-note--bl">commms is a 3D and interactive web team.</p>
      <p class="margin-note margin-note--br">
        my name is Adam,
        <button type="button" class="margin-link" data-nav="about">learn more</button>
      </p>
      <button type="button" class="wordmark" data-nav="home" aria-label="commms — return home">commms</button>
      <nav class="site-nav" aria-label="Site">
        <a href="#" data-nav="work">Work</a>
        <a href="#" data-nav="about">About</a>
      </nav>
    </header>

    <p class="tagline">Interaction and story telling through three dimensional web experiences</p>

    <div class="reticle-field" role="navigation" aria-label="Home navigation">
      <div class="reticle-row" data-row="0"></div>
      <div class="reticle-row" data-row="1"></div>
    </div>

    <!-- Keyboard-reachable proxies for the WORK tiles + ABOUT screen — those
         hit targets otherwise only exist as 3D meshes clickable via canvas
         raycast (mouse-only). Populated by src/home/screen-proxies.ts. See
         docs/superpowers/specs/2026-07-22-phase3-signature-journey-design.md
         (Accessibility section). -->
    <nav class="screen-proxies" aria-label="Jump to a project or section"></nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
