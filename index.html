<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>commms — interaction and story telling</title>
    <link rel="stylesheet" href="https://use.typekit.net/jhm5bdq.css" />
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>

    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <filter id="dissolve" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="disp" />
        <feGaussianBlur in="disp" stdDeviation="0" />
      </filter>
    </svg>

    <header class="chrome">
      <span class="corner-mark tl" aria-hidden="true"></span>
      <span class="corner-mark tr" aria-hidden="true"></span>
      <span class="corner-mark bl" aria-hidden="true"></span>
      <span class="corner-mark br" aria-hidden="true"></span>
      <button type="button" class="wordmark" data-nav="home" aria-label="commms — return home">commms</button>
      <nav class="site-nav" aria-label="Site">
        <a href="#" data-nav="work">Work</a>
        <a href="#" data-nav="about">About</a>
      </nav>
    </header>

    <p class="tagline">Interaction and story telling through three dimensional web experiences</p>

    <div class="reticle-field" role="navigation" aria-label="Home navigation">
      <div class="reticle-row" data-row="0"></div>
      <div class="reticle-row" data-row="1"></div>
    </div>

    <!-- Keyboard-reachable proxies for the WORK tiles + ABOUT screen — those
         hit targets otherwise only exist as 3D meshes clickable via canvas
         raycast (mouse-only). Populated by src/home/screen-proxies.ts. See
         docs/superpowers/specs/2026-07-22-phase3-signature-journey-design.md
         (Accessibility section). -->
    <nav class="screen-proxies" aria-label="Jump to a project or section"></nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
